<article class="project">

      <h1 class="project-title">{{- page.title -}}</h1>
      {%- if page.subtitle -%}<p class="project-venue">{{- page.subtitle -}}</p>{%- endif -%}

  </header>
  <div class="container container--narrow prose">
    {{- content -}}
  </div>
</article>
