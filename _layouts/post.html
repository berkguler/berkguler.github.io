---
layout: default
---
<article class="project">
  <header class="project-header">
    <div class="container container--narrow">
      <p class="project-crumbs"><a href="{{- '/' | relative_url -}}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Home</a></p>
      <h1 class="project-title">{{- page.title -}}</h1>
      <p class="project-venue">{{- page.date | date: "%B %-d, %Y" -}}</p>
    </div>
  </header>
  <div class="container container--narrow prose">
    {{- content -}}
  </div>
</article>
