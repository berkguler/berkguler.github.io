    .smp-dot { animation: smp-pop .35s ease-out both; transform-box: fill-box; transform-origin: center; }
    .smp-best { animation: smp-pop .35s ease-out 1.9s both, smp-pulse 1.6s ease-in-out 2.4s infinite; transform-box: fill-box; transform-origin: center; }
    .smp-arrow { stroke-dasharray: 160; stroke-dashoffset: 0; animation: smp-draw .7s ease-out 2.1s both; }
    @keyframes smp-pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
    @keyframes smp-pulse { 50% { transform: scale(1.35); } }
    @keyframes smp-draw { from { stroke-dashoffset: 160; } to { stroke-dashoffset: 0; } }
