# Research themes, in display order. Each project in _projects/ names its
# theme by `id` and is listed under it, sorted by the project's `order`.

- id: shared-autonomy
  title: Safety-Aware Assistive Teleoperation
  short: Assistive Teleoperation
  icon: fa-solid fa-shield-halved
  blurb: >-
    How can a robot help a remote operator without taking control away from them? I design
    assistive teleoperation algorithms that keep the robot safe as a hard constraint and evaluate
    them in VR teleoperation user studies.

- id: dlo
  title: Deformable Linear Objects
  short: Deformable Linear Objects
  icon: fa-solid fa-bezier-curve
  blurb: >-
    Ropes and cables have a high-dimensional state, occlude themselves, and tangle. My work spans
    assistive teleoperation for DLOs, DLO dynamics prediction, and state representations for
    learning DLO manipulation.

- id: phri
  title: Physical Human–Robot Interaction
  short: Physical HRI
  icon: fa-solid fa-handshake
  blurb: >-
    During my M.Sc. at Koç University I developed adaptive admittance controllers, haptic
    guidance, and learning-based intent estimation for humans and cobots sharing a physical
    task.

- id: early
  title: Earlier Work
  short: Earlier Work
  icon: fa-solid fa-robot
  blurb: >-
    My B.Sc. thesis: an autonomous mobile manipulator with a soft gripper.
