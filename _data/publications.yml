    - { name: Project Page, url: "https://berkguler.github.io/barrierik/", icon: fa-solid fa-globe }
    - { name: Code, url: "https://github.com/berkguler/barrierik_ros", icon: fa-brands fa-github }
    - { name: Unity Framework, url: "https://github.com/berkguler/barrierik_unity", icon: fa-solid fa-vr-cardboard }
    - { name: Video, url: "https://www.youtube.com/watch?v=AtFMYE62igY", icon: fa-brands fa-youtube }
  bibtex: |
