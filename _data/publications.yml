- id: wigginghaus-ws
  kind: workshop
  title: "Learning Sim-Grounded Policies for Bimanual Rope Manipulation from Human Teleoperation Data"
  short: "Sim-grounded rope policies"
  abstract: >-
    Deformable Linear Objects (DLOs) such as ropes and cables are widely encountered in both
    household and industrial applications, yet remain challenging to manipulate due to their
    infinite-dimensional configuration space and frequent self-occlusion. Imitation learning
    from teleoperation offers a practical path to bimanual DLO manipulation, but its scalability
    is limited by human effort, making the choice of observation space critical for
    generalization from small datasets. In this study, we investigate whether the lack of
    generalization in egocentric visual policies for the knot-untangling task stems from the
    observation space itself, rather than from the policy architecture or data scale. We compare
    two Action Chunking with Transformers policies trained on the same bimanual teleoperation
    data: a vision-based policy conditioned on two egocentric RGB streams from wrist-mounted
    cameras, and a state-based policy conditioned on the DLO's 3D particle state, extracted from
    an initial observation via multi-view fusion and evolved in a particle-based eXtended
    Position-Based Dynamics simulation. Evaluated open-loop on an unseen rope configuration, the
    state-based policy outperforms its visual counterpart with a 30.8% reduction in L1 error
    when predicting the initial grasp-and-pull action, quantifying the observability gap between
    pixels and physics-consistent state, and pointing toward more data-efficient robot learning
    for the DLO manipulation task from limited human demonstrations.
  authors: [Gina Wigginghaus*, Tim Missal*, Berk Guler, Simon Manschitz, Jan Peters]
  venue: ICRA Workshop on Beyond Teleoperation
  venue_short: ICRA Workshop
  year: 2026
  links:
    - { name: arXiv, url: "https://arxiv.org/abs/2605.16043", icon: fa-solid fa-file-pdf }
  bibtex: |
    @inproceedings{wigginghaus2026simgrounded,
      title     = {Learning Sim-Grounded Policies for Bimanual Rope Manipulation from Human Teleoperation Data},
      author    = {Wigginghaus, Gina and Missal, Tim and Guler, Berk and Manschitz, Simon and Peters, Jan},
      booktitle = {ICRA Workshop on Beyond Teleoperation},
