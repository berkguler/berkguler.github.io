- id: forwarddlo
  kind: preprint
  title: "ForwardDLO: Model-Based Bimanual Shape Matching of Unconstrained Deformable Linear Objects"
  short: "ForwardDLO"
  abstract: >-
    Ropes, cables, and other deformable linear objects appear in tasks from untangling to cable
    routing and suturing, yet controlling their shape remains a challenge in robot manipulation.
    We study model-based shape control in a general setting: the object lies unfixated on a
    support surface and two arms may grasp and move it anywhere along its length. Because each
    arm chooses a grasp point, direction, and magnitude, the joint action space is
    combinatorially large, and the dynamics model's per-prediction cost bounds how much of it a
    planner can search. We present ForwardDLO, a recurrent latent dynamics model for this
    unfixated bimanual setting that predicts per-segment displacements grounded in the observed
    rope state at every step. Our model reaches accuracy comparable to more expensive baselines
    while containing no explicit segment-to-segment operations, which makes batched evaluation
    of candidate actions cheap. On open-loop prediction of real rope motion it reaches the
    lowest error of the learned models we evaluate, 13% below the strongest baseline. Within a
    fixed time budget it scores 8 to 22 times more candidate actions than models of comparable
    accuracy while matching them in real-world shape matching; and on a simulated routing task
    at a 30 Hz control rate, this throughput converts into 98% task success versus at most 30%
    for the baselines at their own budgets. We release the model, code, and a dataset of 2.42
    million simulated and 14,107 real rope transitions in the project's repository.
  authors: [Tim Missal, Berk Guler, Lucas Domingues, Simon Manschitz, Jan Peters, Paula Dornhofer Paro Costa]
  venue: arXiv preprint arXiv:2609.18455
  venue_short: arXiv
  year: 2026
  links:
    - { name: arXiv, url: "https://arxiv.org/abs/2609.18455", icon: fa-solid fa-file-pdf }
  bibtex: |
    @misc{missal2026forwarddlo,
      title         = {{ForwardDLO}: Model-Based Bimanual Shape Matching of Unconstrained Deformable Linear Objects},
      author        = {Missal, Tim and Guler, Berk and Domingues, Lucas and Manschitz, Simon and Peters, Jan and Costa, Paula Dornhofer Paro},
      year          = {2026},
      eprint        = {2609.18455},
      archivePrefix = {arXiv}
    }

- id: assistdlo
  kind: preprint
  title: "AssistDLO: Assistive Teleoperation for Deformable Linear Object Manipulation"
  short: "AssistDLO"
  abstract: >-
    Manipulating Deformable Linear Objects (DLOs) is challenging in robotics due to their
    infinite-dimensional configuration space and complex nonlinear dynamics. In teleoperation,
    depth uncertainty hinders state perception and reaction. AssistDLO addresses this challenge
    as an assistive teleoperation framework for DLO manipulation that combines real-time
    multi-view state estimation, visual assistance (VA), and a geometry-aware shared-autonomy
    controller based on Control Barrier Functions (SA-CBF). While traditional shared autonomy
    methods often rely on simple geometric attractors and may fail to preserve DLO geometry,
    SA-CBF acts as a geometry-aware funnel, facilitating precise grasping while preserving the
    operator's high-level authority. The framework is evaluated in a bimanual knot-untangling
    user study (N = 22) using ropes with varying length and rigidity. Results show that the
    effectiveness of the assistance depends strongly on operator expertise and DLO properties.
    SA-CBF provides the strongest gains for naive users, acting as a skill equalizer that
    increases task success from 71% to 88%, and is effective for stiffer ropes. Conversely,
    expert users prefer VA, and highly compliant, long ropes benefit more from visual support
    than localized action assistance. Ultimately, these findings demonstrate that effective DLO
    teleoperation cannot rely on a fixed strategy, highlighting the critical need for adaptive,
    user-aware, and material-aware shared autonomy.
  authors: [Berk Guler, Simon Manschitz, Kay Pompetzki, Jan Peters]
  venue: arXiv preprint arXiv:2605.06323
  venue_short: arXiv
  year: 2026
  links:
    - { name: arXiv, url: "https://arxiv.org/abs/2605.06323", icon: fa-solid fa-file-pdf }
  bibtex: |
    @misc{guler2026assistdlo,
      title         = {{AssistDLO}: Assistive Teleoperation for Deformable Linear Object Manipulation},
      author        = {Guler, Berk and Manschitz, Simon and Pompetzki, Kay and Peters, Jan},
      year          = {2026},
      eprint        = {2605.06323},
      archivePrefix = {arXiv}
    }

- id: ropedreamer
  kind: preprint
  title: "RopeDreamer: A Kinematic Recurrent State Space Model for Dynamics of Flexible Deformable Linear Objects"
  short: "RopeDreamer"
  abstract: >-
    The robotic manipulation of Deformable Linear Objects (DLOs) is a fundamental challenge due
    to the high-dimensional, non-linear dynamics of flexible structures and the complexity of
    maintaining topological integrity during contact-rich tasks. While recent data-driven
    methods have utilized Recurrent and Graph Neural Networks for dynamics modeling, they often
    struggle with self-intersections and non-physical deformations, such as tangling and link
    stretching. In this paper, we propose a latent dynamics framework that combines a Recurrent
    State Space Model with a Quaternionic Kinematic Chain representation to enable robust,
    long-term forecasting of DLO states. By encoding the DLO as a sequence of relative rotations
    (quaternions) rather than independent Cartesian positions, we inherently constrain the model
    to a physically valid manifold that preserves link-length constancy. Furthermore, we
    introduce a dual-decoder architecture that decouples state reconstruction from future-state
    prediction, forcing the latent space to capture the underlying physics of deformation. We
    evaluate our approach on a large-scale simulated dataset of complex pick-and-place
    trajectories involving self-intersections. Our results demonstrate that the proposed model
    achieves a 40.52% reduction in open-loop prediction error over 50-step horizons compared to
    the state-of-the-art baseline, while reducing inference time by 31.17%. Our model further
    maintains superior topological consistency in scenarios with multiple crossings, proving its
    efficacy as a compositional primitive for long-horizon manipulation planning. Code, models
    and dataset will be released in a future revision.
  authors: [Tim Missal, Lucas Domingues, Berk Guler, Simon Manschitz, Jan Peters, Paula Dornhofer Paro Costa]
  venue: arXiv preprint arXiv:2604.28161
  venue_short: arXiv
  year: 2026
  links:
    - { name: arXiv, url: "https://arxiv.org/abs/2604.28161", icon: fa-solid fa-file-pdf }
  bibtex: |
    @misc{missal2026ropedreamer,
      title         = {{RopeDreamer}: A Kinematic Recurrent State Space Model for Dynamics of Flexible Deformable Linear Objects},
      author        = {Missal, Tim and Domingues, Lucas and Guler, Berk and Manschitz, Simon and Peters, Jan and Costa, Paula Dornhofer Paro},
      year          = {2026},
      eprint        = {2604.28161},
      archivePrefix = {arXiv}
    }

- id: barrierik
  kind: conference
  title: "A Safety-Aware Shared Autonomy Framework with BarrierIK Using Control Barrier Functions"
  short: "BarrierIK"
  abstract: >-
    Shared autonomy blends operator intent with autonomous assistance. In cluttered
    environments, linear blending can produce unsafe commands even when each source is
    individually collision-free. Many existing approaches model obstacle avoidance through
    potentials or cost terms, which only enforce safety as a soft constraint. In contrast,
    safety-critical control requires hard guarantees. We investigate the use of control barrier
    functions (CBFs) at the inverse kinematics (IK) layer of shared autonomy, targeting
    post-blend safety while preserving task performance. Our approach is evaluated in simulation
    on representative cluttered environments and in a VR teleoperation study comparing pure
    teleoperation with shared autonomy. Across conditions, employing CBFs at the IK layer
    reduces violation time and increases minimum clearance while maintaining task performance.
    In the user study, participants reported higher perceived safety and trust, lower
    interference, and an overall preference for shared autonomy with our safety filter.
  authors: [Berk Guler*, Kay Pompetzki*, Yuanzheng Sun, Simon Manschitz, Jan Peters]
  venue: IEEE International Conference on Robotics and Automation (ICRA)
  venue_short: ICRA
  year: 2026
  links:
