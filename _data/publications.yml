- id: grasp-collision
  kind: conference
  title: "Sampling-Based Grasp and Collision Prediction for Assisted Teleoperation"
  short: "Grasp & collision prediction"
  abstract: >-
    Shared autonomy allows for combining the global planning capabilities of a human operator
    with the strengths of a robot such as repeatability and accurate control. In a real-time
    teleoperation setting, one possibility for shared autonomy is to let the human operator
    decide for the rough movement and to let the robot do fine adjustments, e.g., when the view
    of the operator is occluded. We present a learning-based concept for shared autonomy that
    aims at supporting the human operator in a real-time teleoperation setting. At every step,
    our system tracks the target pose set by the human operator as accurately as possible while
    at the same time satisfying a set of constraints which influence the robot's behavior. An
    important characteristic is that the constraints can be dynamically activated and
    deactivated which allows the system to provide task-specific assistance. Since the system
    must generate robot commands in real-time, solving an optimization problem in every
    iteration is not feasible. Instead, we sample potential target configurations and use Neural
    Networks for predicting the constraint costs for each configuration. By evaluating each
    configuration in parallel, our system is able to select the target configuration which
    satisfies the constraints and has the minimum distance to the operator's target pose with
    minimal delay. We evaluate the framework with a pick and place task on a bi-manual setup
    with two Franka Emika Panda robot arms with Robotiq grippers.
  authors: [Simon Manschitz, Berk Gueler, Wei Ma, Dirk Ruiken]
  venue: IEEE International Conference on Robotics and Automation (ICRA)
  venue_short: ICRA
  year: 2025
  links:
    - { name: arXiv, url: "https://arxiv.org/abs/2504.18186", icon: fa-solid fa-file-pdf }
  bibtex: |
    @inproceedings{manschitz2025sampling,
      title     = {Sampling-Based Grasp and Collision Prediction for Assisted Teleoperation},
      author    = {Manschitz, Simon and Gueler, Berk and Ma, Wei and Ruiken, Dirk},
      booktitle = {IEEE International Conference on Robotics and Automation (ICRA)},
      year      = {2025}
    }

