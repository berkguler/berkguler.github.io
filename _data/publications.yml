- id: mechatronics
  kind: journal
  title: "An adaptive admittance controller for collaborative drilling with a robot based on subtask classification via deep learning"
  short: "Adaptive admittance via subtask classification"
  abstract: >-
    In this paper, we propose a supervised learning approach based on an Artificial Neural
    Network (ANN) model for real-time classification of subtasks in a physical human-robot
    interaction (pHRI) task involving contact with a stiff environment. In this regard, we
    consider three subtasks for a given pHRI task: Idle, Driving, and Contact. Based on this
    classification, the parameters of an admittance controller that regulates the interaction
    between human and robot are adjusted adaptively in real time to make the robot more
    transparent to the operator (i.e. less resistant) during the Driving phase and more stable
    during the Contact phase. The Idle phase is primarily used to detect the initiation of task.
    Experimental results have shown that the ANN model can learn to detect the subtasks under
    different admittance controller conditions with an accuracy of 98% for 12 participants.
    Finally, we show that the admittance adaptation based on the proposed subtask classifier
    leads to 20% lower human effort (i.e. higher transparency) in the Driving phase and 25%
    lower oscillation amplitude (i.e. higher stability) during drilling in the Contact phase
    compared to an admittance controller with fixed parameters.
  authors: [Berk Guler, Pouya P. Niaz, Alireza Madani, Yusuf Aydin, Cagatay Basdogan]
  venue: Mechatronics, vol. 86, p. 102851
  venue_short: Mechatronics
  year: 2022
  links:
    - { name: Paper, url: "https://www.sciencedirect.com/science/article/pii/S0957415822000800", icon: fa-solid fa-book-open }
    - { name: arXiv, url: "https://arxiv.org/abs/2205.14457", icon: fa-solid fa-file-pdf }
  bibtex: |
    @article{guler2022adaptive,
      title   = {An adaptive admittance controller for collaborative drilling with a robot based on subtask classification via deep learning},
      author  = {Guler, Berk and Niaz, Pouya P. and Madani, Alireza and Aydin, Yusuf and Basdogan, Cagatay},
